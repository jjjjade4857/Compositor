name: Chinese build
on:
  push:
    branches: [zh-Hans]
  pull_request:
    branches: [zh-Hans]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check maintenance regressions
        run: python3 scripts/test-maintenance.py
      - name: Check translation coverage
        run: python3 scripts/audit-localization.py
      - name: Review all source literals and display boundaries
        run: python3 scripts/review-localization.py
      - name: Generate bundle resources
        run: python3 scripts/generate-localization.py
      - name: Build Chinese edition
        run: >-
          xcodebuild build -project Compositor.xcodeproj -scheme Compositor
          -configuration Release -destination 'platform=macOS,arch=arm64'
          -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO
          PRODUCT_BUNDLE_IDENTIFIER=io.github.jjjjade4857.Compositor.zhHans
      - name: Review compiler-extracted localization keys
        run: python3 scripts/review-localization.py --compiler-data build/DerivedData --require-compiler-data
      - name: Verify resources and package
        run: |
          app=build/DerivedData/Build/Products/Release/Compositor.app
          python3 scripts/configure-chinese-bundle.py "$app"
          test -f "$app/Contents/Resources/zh-Hans.lproj/Localizable.strings"
          test -f "$app/Contents/Resources/ChineseTranslations.json"
          plutil -lint "$app/Contents/Resources/zh-Hans.lproj/Localizable.strings"
          codesign --force --deep --sign - "$app"
          codesign --force --sign - --entitlements Config/Compositor.entitlements "$app"
          codesign --verify --strict "$app"
          mkdir -p build/package
          ditto "$app" "build/package/Compositor 中文版.app"
          ditto -c -k --sequesterRsrc --keepParent "build/package/Compositor 中文版.app" build/Compositor-zh-Hans.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Compositor-zh-Hans-${{ github.sha }}
          path: build/Compositor-zh-Hans.zip
          retention-days: 30
